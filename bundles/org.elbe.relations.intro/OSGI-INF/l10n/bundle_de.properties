welcome.fallback.text = Die Relations-Applikation ist ein Werkzeug für das Wissensmanagement. Sie ist eine Kombination aus einem persönlichen Wiki und einem elektronischen Zettelkasten. Sie können ganz einfach Einträge von drei Typen (Begriffe, Texte und Personen) erfassen und mit bereits vorhandenen Einträgen in Beziehung setzen. So entsteht ein reicher Kontext für Ihre Einträge.
